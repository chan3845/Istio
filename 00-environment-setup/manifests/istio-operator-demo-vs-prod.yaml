# IstioOperator Configuration for the Hands-On Course Lab Cluster
# Install with: istioctl install -f 00-environment-setup/manifests/istio-operator-demo-vs-prod.yaml -y
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  namespace: istio-system
  name: istio-course-control-plane
spec:
  # We start from the 'default' profile (production baseline) rather than 'demo'
  # and explicitly enable only the components and settings we want to understand.
  profile: default

  meshConfig:
    # Enable Envoy access logs to stdout so we can inspect L7 telemetry and Envoy response flags
    accessLogFile: /dev/stdout
    accessLogEncoding: TEXT
    # Default outbound policy starts as ALLOW_ANY; in Module 03 & 10 we lock this down to REGISTRY_ONLY
    outboundTrafficPolicy:
      mode: ALLOW_ANY
    # Enable DNS capture in istio-agent so ServiceEntries with resolution: DNS resolve inside the pod
    defaultConfig:
      proxyMetadata:
        ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_DNS_AUTO_ALLOCATE: "true"
      # Drain duration before Envoy terminates during pod shutdown
      drainDuration: 45s
      terminationDrainDuration: 5s
      tracing:
        sampling: 100.0 # 100% in lab environment; in production set to 0.1 - 1.0%
    enableTracing: true
    extensionProviders:
      - name: jaeger
        opentelemetry:
          service: jaeger-collector.istio-system.svc.cluster.local
          port: 4317
      - name: envoy-json-logs
        envoyFileAccessLog:
          path: /dev/stdout
          logFormat:
            labels:
              timestamp: "%START_TIME%"
              client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
              method: "%REQ(:METHOD)%"
              path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
              protocol: "%PROTOCOL%"
              response_code: "%RESPONSE_CODE%"
              response_flags: "%RESPONSE_FLAGS%"
              bytes_received: "%BYTES_RECEIVED%"
              bytes_sent: "%BYTES_SENT%"
              duration_ms: "%DURATION%"
              upstream_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
              upstream_host: "%UPSTREAM_HOST%"
              upstream_cluster: "%UPSTREAM_CLUSTER%"
              x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
              user_agent: "%REQ(USER-AGENT)%"
              request_id: "%REQ(X-REQUEST-ID)%"
              authority: "%REQ(:AUTHORITY)%"
              downstream_tls_cipher: "%DOWNSTREAM_TLS_CIPHER%"
              spiffe_peer: "%DOWNSTREAM_PEER_URI_SAN%"

  components:
    pilot:
      k8s:
        env:
          # Enable Kubernetes 1.29+ native sidecar containers if supported by cluster
          - name: PILOT_ENABLE_STATUS
            value: "true"
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi

    ingressGateways:
      - name: istio-ingressgateway
        enabled: true
        k8s:
          service:
            type: NodePort
            ports:
              - port: 15021
                targetPort: 15021
                nodePort: 31021
                name: status-port
              - port: 80
                targetPort: 8080
                nodePort: 30080
                name: http2
              - port: 443
                targetPort: 8443
                nodePort: 30443
                name: https

    egressGateways:
      - name: istio-egressgateway
        enabled: true
        k8s:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

