# =============================================================================
# Lab Control Plane Helm Values for Istio 1.32.0 (istio/istiod chart)
# =============================================================================
# Compatible with Helm 3 (v3.16+) and Helm 4 (v4.3.x).
#
# IMPORTANT NOTE ON ISTIO 1.32.0 HELM PROFILES (`zzz_profile.yaml`):
# In the official `istio/istiod` 1.32.0 Helm chart, the chart's built-in
# `values.yaml` (`_internal_defaults_do_not_set`) IS ALREADY the `default` profile.
# The chart only ships overlay files (`files/profile-<name>.yaml`) for non-default
# profiles (`ambient`, `demo`, `preview`, `remote`, `stable`).
# Setting `profile: default` causes `istiod/templates/zzz_profile.yaml` to fail
# with `unknown profile default`. Leave `profile` unset (or `""`) for the default
# sidecar profile.
#
# Install with:
#   helm repo add istio https://blob.istio.io/istio-release/charts --force-update
#   helm repo update
#   helm upgrade --install istio-base istio/base -n istio-system --create-namespace --version 1.32.0 --set defaultRevision=default --wait
#   helm upgrade --install istiod istio/istiod -n istio-system --version 1.32.0 -f 00-environment-setup/manifests/helm-values-istiod.yaml --wait
# =============================================================================

# Top-level istiod (Pilot) settings matching istio/istiod 1.32.0 values.yaml schema
autoscaleEnabled: false
replicaCount: 1

# Sets PILOT_TRACE_SAMPLING on istiod (100% in lab so every curl produces a trace)
traceSampling: 100.0

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 1024Mi

env:
  PILOT_ENABLE_STATUS: "true"
  # Native Kubernetes sidecar containers (KEP-753, GA in K8s 1.33+)
  ENABLE_NATIVE_SIDECARS: "true"

meshConfig:
  # Enable Envoy access logs to stdout so we can inspect L7 telemetry and Envoy response flags
  accessLogFile: /dev/stdout
  accessLogEncoding: TEXT
  # Default outbound policy starts as ALLOW_ANY; in Module 03 & Module 10 we lock this down to REGISTRY_ONLY
  outboundTrafficPolicy:
    mode: ALLOW_ANY
  enableTracing: true
  defaultConfig:
    # Enable DNS capture in pilot-agent so ServiceEntries with resolution: DNS resolve inside the pod
    proxyMetadata:
      ISTIO_META_DNS_CAPTURE: "true"
      ISTIO_META_DNS_AUTO_ALLOCATE: "true"
    drainDuration: 45s
    terminationDrainDuration: 5s
    tracing:
      # 100% sampling in the lab environment; in production set to 1.0% (see helm-values-prod.yaml)
      sampling: 100.0
  extensionProviders:
    - name: jaeger
      opentelemetry:
        service: jaeger-collector.istio-system.svc.cluster.local
        port: 4317
    - name: envoy-json-logs
      envoyFileAccessLog:
        path: /dev/stdout
        logFormat:
          labels:
            timestamp: "%START_TIME%"
            client_ip: "%DOWNSTREAM_REMOTE_ADDRESS_WITHOUT_PORT%"
            method: "%REQ(:METHOD)%"
            path: "%REQ(X-ENVOY-ORIGINAL-PATH?:PATH)%"
            protocol: "%PROTOCOL%"
            response_code: "%RESPONSE_CODE%"
            response_flags: "%RESPONSE_FLAGS%"
            bytes_received: "%BYTES_RECEIVED%"
            bytes_sent: "%BYTES_SENT%"
            duration_ms: "%DURATION%"
            upstream_service_time: "%RESP(X-ENVOY-UPSTREAM-SERVICE-TIME)%"
            upstream_host: "%UPSTREAM_HOST%"
            upstream_cluster: "%UPSTREAM_CLUSTER%"
            x_forwarded_for: "%REQ(X-FORWARDED-FOR)%"
            user_agent: "%REQ(USER-AGENT)%"
            request_id: "%REQ(X-REQUEST-ID)%"
            authority: "%REQ(:AUTHORITY)%"
            downstream_tls_cipher: "%DOWNSTREAM_TLS_CIPHER%"
            spiffe_peer: "%DOWNSTREAM_PEER_URI_SAN%"
