# =============================================================================
# Istio Ingress Gateway Helm Values for Local Kind Cluster (istio/gateway chart)
# =============================================================================
# Maps NodePorts (30080 -> 8080, 30443 -> 8443, 31021 -> 15021) to match
# 00-environment-setup/manifests/kind-cluster.yaml extraPortMappings.
#
# Install with:
#   helm upgrade --install istio-ingressgateway istio/gateway -n istio-system --version 1.32.0 \
#     -f 00-environment-setup/manifests/helm-values-ingressgateway.yaml --wait
# =============================================================================

name: istio-ingressgateway

labels:
  app: istio-ingressgateway
  istio: ingressgateway

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

service:
  type: NodePort
  ports:
    - name: status-port
      port: 15021
      targetPort: 15021
      nodePort: 31021
      protocol: TCP
    - name: http2
      port: 80
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
    - name: https
      port: 443
      targetPort: 8443
      nodePort: 30443
      protocol: TCP

