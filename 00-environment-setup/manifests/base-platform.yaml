# ==============================================================================
# CLIENT TOOLBOX (In-Mesh Diagnostic & Testing Pod)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: toolbox-sa
  namespace: orderflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-toolbox
  namespace: orderflow
  labels:
    app: client-toolbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: client-toolbox
  template:
    metadata:
      labels:
        app: client-toolbox
    spec:
      serviceAccountName: toolbox-sa
      containers:
        - name: toolbox
          image: curlimages/curl:8.10.1
          command: ["/bin/sh", "-c", "sleep 3650d"]
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
---
