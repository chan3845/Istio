# OrderFlow Reference Microservices Platform
# Topology:
#   frontend (v1) -> order-service (v1, v2) -> payment-service (v1, v2) & inventory-service (v1)
#   client-toolbox (curl inside mesh)
#   legacy-client (curl outside mesh in legacy-uninjected namespace)
#
# All services use explicit Istio port naming (http-*) and dedicated Kubernetes ServiceAccounts
# to provide distinct SPIFFE identities (spiffe://cluster.local/ns/orderflow/sa/<sa-name>).
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-sa
  namespace: orderflow
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: orderflow
  labels:
    app: frontend
    service: frontend
spec:
  ports:
    - name: http-web
      port: 80
      targetPort: 8080
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-v1
  namespace: orderflow
  labels:
    app: frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
      version: v1
  template:
    metadata:
      labels:
        app: frontend
        version: v1
    spec:
      serviceAccountName: frontend-sa
      containers:
        - name: frontend
          image: nicholasjackson/fake-service:v0.26.2
          ports:
            - containerPort: 8080
              name: http-web
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAME
              value: "frontend-v1"
            - name: MESSAGE
              value: "OrderFlow Web Storefront v1"
            - name: SERVER_TYPE
              value: "http"
            - name: UPSTREAM_URIS
              value: "http://order-service.orderflow.svc.cluster.local:8080"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
# ==============================================================================
# ORDER SERVICE (v1 and v2)
# Calls both payment-service and inventory-service
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-sa
  namespace: orderflow
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: orderflow
  labels:
    app: order-service
    service: order-service
spec:
  ports:
    - name: http-api
      port: 8080
      targetPort: 8080
  selector:
    app: order-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-v1
  namespace: orderflow
  labels:
    app: order-service
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
      version: v1
  template:
    metadata:
      labels:
        app: order-service
        version: v1
    spec:
      serviceAccountName: order-sa
      containers:
        - name: order-service
          image: nicholasjackson/fake-service:v0.26.2
          ports:
            - containerPort: 8080
              name: http-api
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAME
              value: "order-service-v1"
            - name: MESSAGE
              value: "Order Processing Engine v1 (Standard)"
            - name: SERVER_TYPE
              value: "http"
            - name: UPSTREAM_URIS
              value: "http://payment-service.orderflow.svc.cluster.local:8080,http://inventory-service.orderflow.svc.cluster.local:8080"
            - name: HTTP_CLIENT_APPEND_REQUEST
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service-v2
  namespace: orderflow
  labels:
    app: order-service
    version: v2
spec:
  replicas: 1
  selector:
    matchLabels:
      app: order-service
      version: v2
  template:
    metadata:
      labels:
        app: order-service
        version: v2
    spec:
      serviceAccountName: order-sa
      containers:
        - name: order-service
          image: nicholasjackson/fake-service:v0.26.2
          ports:
            - containerPort: 8080
              name: http-api
          env:
            - name: LISTEN_ADDR
              value: "0.0.0.0:8080"
            - name: NAME
              value: "order-service-v2"
            - name: MESSAGE
              value: "Order Processing Engine v2 (Express Checkout)"
            - name: SERVER_TYPE
              value: "http"
            - name: UPSTREAM_URIS
              value: "http://payment-service.orderflow.svc.cluster.local:8080,http://inventory-service.orderflow.svc.cluster.local:8080"
            - name: HTTP_CLIENT_APPEND_REQUEST
              value: "true"
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
---
