# Module 03: Modern Kubernetes Gateway API (Gateway + HTTPRoute)
# Automatically provisions an Istio-managed Gateway Deployment & Service in 'orderflow'
# using gatewayClassName: istio.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: orderflow-k8s-gateway
  namespace: orderflow
spec:
  gatewayClassName: istio
  listeners:
    - name: http
      hostname: "orderflow.example.com"
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      hostname: "orderflow.example.com"
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - name: orderflow-gwapi-tls
            kind: Secret
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: orderflow-k8s-httproute
  namespace: orderflow
spec:
  parentRefs:
    - name: orderflow-k8s-gateway
      sectionName: https
  hostnames:
    - "orderflow.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /orders
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      backendRefs:
        - name: order-service
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 80
