# Module 04: End-User JWT Authentication (RequestAuthentication) + Claim-Based AuthorizationPolicy
# Uses inline JWKS so JWT verification works 100% offline/air-gapped without external internet calls.
apiVersion: security.istio.io/v1
kind: RequestAuthentication
metadata:
  name: order-service-jwt-authn
  namespace: orderflow
spec:
  selector:
    matchLabels:
      app: order-service
  jwtRules:
    - issuer: "testing@secure.istio.io"
      forwardOriginalToken: true
      jwks: |
        {"keys":[{"e":"AQAB","kid":"DHFbpoIUqrY8t2zpA2qXfCmr5VO5ZEr4RzHU_-QivvQ","kty":"RSA","n":"xAE7eB6qugXyCAG3yhh7pkDkT65pHymX-P7KfIupjf59vsdo91bSP9C8H07pSAGQO1MV_xFj9VswgsCg4R6otmg5PV2He9mbdZdHtD9M3b_QB0WP373Nl4615CoXv31E6Bnb6RY0LhEe60ZqB376lLh9_bQ353B1s2T02H3_r2f2tw"}]}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-order-admin-jwt
  namespace: orderflow
spec:
  selector:
    matchLabels:
      app: order-service
  action: ALLOW
  rules:
    - from:
        - source:
            requestPrincipals: ["testing@secure.istio.io/testing@secure.istio.io"]
      to:
        - operation:
            methods: ["GET"]
            paths: ["/admin", "/admin/*"]
      when:
        - key: request.auth.claims[groups]
          values: ["group1"]
---
