# Production-Grade High Availability Istio 1.32.0 Control Plane Configuration
# Demonstrates multi-replica istiod, HPA, PDB, zone anti-affinity,
# native K8s sidecars (GA in K8s 1.33+), and graceful connection draining.
#
# NOTE ON ISTIO 1.32 INSTALLATION ARCHITECTURE:
# Because the in-cluster IstioOperator controller was deprecated in 1.23 and removed in 1.24,
# this IstioOperator YAML is used strictly as a local CLI input file to:
#   istioctl install -f 08-debugging-and-production-operations/manifests/production-istiod-ha-iop.yaml -y
# (or `istioctl install --set revision=1-32-0`).
# For declarative production GitOps (ArgoCD / Flux), use the official Istio Helm charts
# (`helm install istiod istio/istiod --set revision=1-32-canary -f 00-environment-setup/manifests/helm-values-prod.yaml`).
apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
metadata:
  name: istio-control-plane-ha
  namespace: istio-system
spec:
  profile: default
  revision: 1-32-canary
  meshConfig:
    accessLogFile: /dev/stdout
    accessLogEncoding: JSON
    outboundTrafficPolicy:
      mode: REGISTRY_ONLY
    defaultConfig:
      terminationDrainDuration: 30s
      proxyMetadata:
        EXIT_ON_ZERO_ACTIVE_CONNECTIONS: "true"
         ISTIO_META_DNS_CAPTURE: "true"
        ISTIO_META_DNS_AUTO_ALLOCATE: "true"
  components:
    pilot:
      enabled: true
      k8s:
        replicaCount: 3
        resources:
          requests:
            cpu: 500m
            memory: 2048Mi
          limits:
            cpu: 2000m
            memory: 4096Mi
        hpaSpec:
          minReplicas: 3
          maxReplicas: 10
          metrics:
            - type: Resource
              resource:
                name: cpu
                target:
                  type: Utilization
                  averageUtilization: 70
        podDisruptionBudget:
          minAvailable: 2
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchLabels:
                      app: istiod
                  topologyKey: topology.kubernetes.io/zone
        env:
          - name: PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_OUTBOUND
            value: "true"
          - name: ENABLE_NATIVE_SIDECARS
            value: "true"
