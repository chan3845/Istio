# Scenario 2: mTLS Conflict Causing 503 UF (Upstream Connection Failure)
# payment-service enforces STRICT mTLS via PeerAuthentication,
# but a misconfigured DestinationRule forces clients to send plaintext (DISABLE).
apiVersion: security.istio.io/v1
kind: PeerAuthentication
metadata:
  name: payment-service-strict-mtls
  namespace: orderflow
spec:
  selector:
    matchLabels:
      app: payment-service
  mtls:
    mode: STRICT
---
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service-dr
  namespace: orderflow
spec:
  host: payment-service.orderflow.svc.cluster.local
  trafficPolicy:
    tls:
      # ❌ Misconfiguration: Disables client-side mTLS while server requires STRICT mTLS
      mode: DISABLE
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payment-service-vs
  namespace: orderflow
spec:
  hosts:
    - payment-service.orderflow.svc.cluster.local
  http:
    - route:
        - destination:
            host: payment-service.orderflow.svc.cluster.local
            subset: v1
          weight: 100
