# =============================================================================
# Production-Grade High Availability Istio 1.32.0 Control Plane Helm Values
# =============================================================================
# Demonstrates multi-replica istiod, HPA (3-10 replicas), PDB (minAvailable: 2),
# zone anti-affinity, native Kubernetes sidecars (GA in K8s 1.33+),
# REGISTRY_ONLY egress lockdown, and graceful connection draining.
#
# Used in Module 08 & Week 09 for Revision-Based Canary Control Plane Upgrades:
#   helm upgrade --install istiod-1-32-canary istio/istiod -n istio-system --version 1.32.0 \
#     -f 08-debugging-and-production-operations/manifests/production-istiod-ha-helm-values.yaml
# =============================================================================

profile: default

# Explicit revision tag creates an isolated side-by-side Deployment (istiod-1-32-canary),
# Service (istiod-1-32-canary.istio-system.svc), and MutatingWebhookConfiguration.
revision: 1-32-canary

pilot:
  autoscaleEnabled: true
  autoscaleMin: 3
  autoscaleMax: 10
  replicaCount: 3
  cpu:
    targetAverageUtilization: 70
  resources:
    requests:
      cpu: 500m
      memory: 2048Mi
    limits:
      cpu: 2000m
      memory: 4096Mi
  env:
    PILOT_ENABLE_STATUS: "true"
    PILOT_ENABLE_PROTOCOL_SNIFFING_FOR_OUTBOUND: "true"
    ENABLE_NATIVE_SIDECARS: "true"
  podAntiAffinityLabelSelector:
    - key: app
      operator: In
      values: istiod
      topologyKey: topology.kubernetes.io/zone

pdb:
  enabled: true
  minAvailable: 2

meshConfig:
  accessLogFile: /dev/stdout
  accessLogEncoding: JSON
  outboundTrafficPolicy:
    mode: REGISTRY_ONLY
  defaultConfig:
    terminationDrainDuration: 30s
    proxyMetadata:
      EXIT_ON_ZERO_ACTIVE_CONNECTIONS: "true"
      ISTIO_META_DNS_CAPTURE: "true"
      ISTIO_META_DNS_AUTO_ALLOCATE: "true"
    tracing:
      sampling: 1.0

