apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: payment-service-subsets
  namespace: orderflow
spec:
  host: payment-service.orderflow.svc.cluster.local
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: payment-service-progressive
  namespace: orderflow
spec:
  hosts:
    - payment-service.orderflow.svc.cluster.local
  http:
    - route:
        - destination:
            host: payment-service.orderflow.svc.cluster.local
            subset: v1
            port:
              number: 8080
          weight: 100
      mirror:
        host: payment-service.orderflow.svc.cluster.local
        subset: v2
      mirrorPercentage:
        value: 100.0
