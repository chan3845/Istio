---
# ============================================================================
# 4. ledger-service (novapay-pci): Circuit Breaking, Outlier Detection,
#    & 100% Asynchronous Shadow Traffic Mirroring (v1 -> v2)
# ============================================================================
apiVersion: networking.istio.io/v1
kind: DestinationRule
metadata:
  name: ledger-service-dr
  namespace: novapay-pci
spec:
  host: ledger-service.novapay-pci.svc.cluster.local
  exportTo:
    - "."
    - "novapay"
  trafficPolicy:
    tls:
      mode: ISTIO_MUTUAL
    connectionPool:
      tcp:
        maxConnections: 100
      http:
        http1MaxPendingRequests: 50
        maxRequestsPerConnection: 50
    outlierDetection:
      consecutive5xxErrors: 3
      interval: 10s
      baseEjectionTime: 30s
      maxEjectionPercent: 50
  subsets:
    - name: v1
      labels:
        version: v1
    - name: v2
      labels:
        version: v2
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: ledger-service-vs
  namespace: novapay-pci
spec:
  hosts:
    - ledger-service.novapay-pci.svc.cluster.local
  exportTo:
    - "."
    - "novapay"
  http:
    - name: ledger-live-with-shadow-mirror
      timeout: 3s
      retries:
        attempts: 2
        perTryTimeout: 1s
        retryOn: connect-failure,refused-stream,unavailable,cancelled,reset,5xx
      route:
        - destination:
            host: ledger-service.novapay-pci.svc.cluster.local
            subset: v1
          weight: 100
      mirror:
        host: ledger-service.novapay-pci.svc.cluster.local
        subset: v2
      mirrorPercentage:
        value: 100.0
