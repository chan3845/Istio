apiVersion: v1
kind: ServiceAccount
metadata:
  name: toolbox-sa
  namespace: orderflow
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fortio-load
  namespace: orderflow
  labels:
    app: fortio-load
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fortio-load
  template:
    metadata:
      labels:
        app: fortio-load
    spec:
      serviceAccountName: toolbox-sa
      containers:
        - name: fortio
          image: fortio/fortio:latest_release
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http-fortio
            - containerPort: 8079
              name: grpc-ping
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
